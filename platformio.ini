; ESP32 Wi-Fi clock — PlatformIO project
; Docs: docs/idea.md, docs/hardware.md, docs/wiring.md

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -Wall

lib_deps =
    olikraus/U8g2 @ 2.36.18
    adafruit/RTClib @ 2.1.4
