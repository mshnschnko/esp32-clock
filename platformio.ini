; ESP32 Wi-Fi clock — PlatformIO project
; Docs: docs/idea.md, docs/hardware.md, docs/wiring.md

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32 @ 8.0.0
board = esp32dev
framework = arduino
; 2 x 1.9 MB app slots (OTA kept for the future), small SPIFFS.
; The default 1.25 MB slot is too small with Wi-Fi + WiFiManager + display code.
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, send_on_enter
monitor_echo = yes
monitor_eol = LF

build_flags =
    -Wall

lib_deps =
    olikraus/U8g2 @ 2.36.18
    adafruit/RTClib @ 2.1.4
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ 7.4.3
